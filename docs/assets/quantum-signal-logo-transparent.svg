<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">QuantumSignal rocket impact logo</title>
  <desc id="desc">A premium rocket impacts a cratered Moon while a folded paper growth ribbon rises behind it.</desc>
  <defs>
    <radialGradient id="bg" cx="68%" cy="25%" r="90%"><stop offset="0" stop-color="#183650"/><stop offset=".55" stop-color="#091722"/><stop offset="1" stop-color="#050b11"/></radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbfb"/><stop offset=".5" stop-color="#b9c8cc"/><stop offset="1" stop-color="#6d8088"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".48" stop-color="#b8edf2"/><stop offset="1" stop-color="#5896b2"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38e0a1"/><stop offset=".55" stop-color="#67a7ff"/><stop offset="1" stop-color="#d9f7ff"/></linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff4a6"/><stop offset=".4" stop-color="#ffcc66"/><stop offset="1" stop-color="#ff6e7f"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <!-- folded paper growth ribbon, elegant rather than blocky -->
  <path d="M96 575 C164 561 180 505 239 489 L239 422 L318 422 L318 333 L396 333 L396 235 L466 235" fill="none" stroke="#02080d" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
  <path d="M96 562 C164 548 180 492 239 476 L239 409 L318 409 L318 320 L396 320 L396 222 L466 222" fill="none" stroke="url(#paper)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M96 562 C164 548 180 492 239 476 L239 409 L318 409 L318 320 L396 320 L396 222 L466 222" fill="none" stroke="#e9ffff" stroke-opacity=".3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Moon -->
  <g>
    <circle cx="520" cy="174" r="122" fill="url(#moon)" stroke="#f5ffff" stroke-width="7"/>
    <ellipse cx="479" cy="136" rx="28" ry="17" fill="#7b9098" opacity=".55" transform="rotate(-24 479 136)"/>
    <ellipse cx="562" cy="196" rx="22" ry="14" fill="#70858e" opacity=".58" transform="rotate(32 562 196)"/>
    <circle cx="533" cy="113" r="13" fill="#70858e" opacity=".5"/>
    <circle cx="457" cy="210" r="10" fill="#70858e" opacity=".52"/>
    <path d="M468 186 Q500 165 529 187 T591 181" fill="none" stroke="#647982" stroke-width="8" stroke-linecap="round" opacity=".65"/>
    <path d="M484 231 Q515 214 546 230" fill="none" stroke="#647982" stroke-width="6" stroke-linecap="round" opacity=".55"/>
  </g>
  <!-- rocket and impact -->
  <g transform="rotate(-42 382 348)">
    <path d="M328 429 C311 375 327 298 384 246 C427 207 481 190 518 188 C514 227 495 282 455 323 C405 374 347 384 328 429Z" fill="url(#body)" stroke="#e8ffff" stroke-width="8"/>
    <path d="M388 245 Q419 214 454 221 L433 273Z" fill="#67a7ff" stroke="#16384f" stroke-width="7"/>
    <circle cx="432" cy="260" r="24" fill="#071019" stroke="#38e0a1" stroke-width="8"/>
    <circle cx="425" cy="253" r="7" fill="#d9ffff"/>
    <path d="M350 367 L290 391 L321 332Z" fill="#ff6e7f" stroke="#0b1c29" stroke-width="8"/>
    <path d="M409 418 L405 478 L451 435Z" fill="#ff6e7f" stroke="#0b1c29" stroke-width="8"/>
    <path d="M345 414 C310 455 300 493 315 526 C352 507 376 478 389 438Z" fill="url(#flame)" stroke="#ff6e7f" stroke-width="8"/>
    <path d="M330 458 C316 480 314 498 321 513" fill="none" stroke="#fff4a6" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- impact ring and debris -->
  <circle cx="449" cy="187" r="38" fill="none" stroke="#ff6e7f" stroke-width="10" opacity=".85"/>
  <circle cx="449" cy="187" r="62" fill="none" stroke="#ffcc66" stroke-width="5" stroke-dasharray="14 16" opacity=".9"/>
  <path d="M432 179 L396 150 M448 166 L445 128 M468 178 L493 148 M474 196 L512 201" stroke="#ffcc66" stroke-width="9" stroke-linecap="round"/>
  <circle cx="375" cy="150" r="7" fill="#67a7ff"/><circle cx="587" cy="315" r="6" fill="#38e0a1"/><circle cx="205" cy="206" r="5" fill="#67a7ff"/>
</svg>
